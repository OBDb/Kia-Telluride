generations:
  - name: "First Generation (ON)"
    start_year: 2020
    end_year: 2025
    description: "The first-generation Kia Telluride launched as the brand's flagship three-row midsize SUV, making a strong impression with its bold, boxy design and upscale appearance. Powered by a 3.8L naturally aspirated V6 Lambda II Atkinson cycle engine producing 291 horsepower and 262 lb-ft of torque, paired with an eight-speed A8LF1 automatic transmission and available active on-demand all-wheel drive. The spacious interior accommodated up to eight passengers across three rows, with notable features including available premium Nappa leather, 10.25-inch touchscreen infotainment system, Harman Kardon audio, and heated/ventilated first and second-row seats. The Telluride offered comprehensive safety technology including standard forward collision warning, automatic emergency braking, lane-keeping assist, and available blind-spot monitoring. Despite being Kia's first entry into the highly competitive three-row midsize SUV segment, the Telluride quickly became a sales success and earned numerous industry awards including the prestigious 2020 World Car of the Year and North American SUV of the Year. The first-generation Telluride established a reputation for offering near-luxury features and design at mainstream pricing, setting a new standard for the brand and segment. A mid-cycle refresh for 2023 model year introduced updated front fascia, new grille design, reshaped bumpers, and new X-Line and X-Pro trim levels with all-terrain capability."

  - name: "Second Generation (LQ2)"
    start_year: 2026
    end_year: null
    description: "The second-generation Kia Telluride was revealed online on November 10, 2025, and officially debuted at the 2025 Los Angeles Auto Show on November 20, 2025. Built on an all-new platform (LQ2), the second-generation Telluride represents a complete redesign with significant updates to styling, technology, and capability. Deliveries were scheduled to commence in early 2026. As the successor to the highly successful first generation, the new Telluride continues Kia's strategy of offering near-luxury features and design at mainstream pricing in the three-row midsize SUV segment."